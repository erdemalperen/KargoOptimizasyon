[phases.setup]
# Ship a full Python runtime with stdlib so encodings are available at run time.
nixPkgs = ["python311Full", "pip"]

[phases.install]
cmds = [
  "python -m venv .venv",
  ". .venv/bin/activate && pip install --upgrade pip",
  ". .venv/bin/activate && pip install --no-cache-dir -r requirements.txt",
]

[start]
cmd = ". .venv/bin/activate && python -m streamlit run app.py --server.port ${PORT:-8080} --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
